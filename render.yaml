databases:
  - name: cinematch-db
    plan: free
    databaseName: cinematch
    user: cinematch

services:
  - type: web
    name: movie-recommender-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OMDB_API_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: ENABLE_SEMANTIC
        value: "1"
      - key: CHAT_RATE_LIMIT
        value: 20/minute
      - key: DATABASE_URL
        fromDatabase:
          name: cinematch-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://movierecommender-frontend.vercel.app
