services:
  - type: web
    name: movie-recommender-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TMDB_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"

